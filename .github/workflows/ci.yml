# Every push and pull request (docs/phase-0-plan.md, Pipelines and Gates on every merge to main):
#   check     pnpm check (Biome with the i18n GritQL plugin, the guards, type check, unit tests) and
#             generated files up to date (i18n messages, tokens)
#   gitleaks  secret scan with .gitleaks.toml
#   stack     the slim local stack (pnpm db:start, as pnpm dev:local starts it; the edge runtime runs
#             under functions serve), then a clean db reset of every migration and the seed (P.9), then
#             supabase functions serve; pgTAP; the functions' integration tests and the
#             desktop flow against the stack; the dashboard smoke test (Playwright Chromium); the demo
#             scripts against the real schema; then send-invites (WP 1.4) and pilot-notify (WP 1.13) again
#             with UKI_EMAIL_SINK set
#   build     web, the mock portal and Üki Lock (Chrome and Edge zips, uploaded as the uki-lock artifact),
#             then the Üki Lock smoke test in headless Chrome for Testing
#   windows   WP 0.12 on windows-latest: pnpm check, the x64 zip, the NSIS installer, the launch test of
#             the packaged Uki.exe from the zip and from a current-user install, and the lab zip; WP 0.13:
#             the real keyboard hook installed and removed, Koffi in every Windows build, and the
#             launch test's log showing that the packaged app loaded it; the smoke zip for a Windows box
#             with no webcam (the synthetic camera, built with the release's variables) and its launch
#             test. Each build is checked for exactly its variant's development-only code
#             (.github/scripts/desktop-variant-check.sh): none in the shipped builds
#   desktop   the unsigned macOS installers, dmg arm64 and x64 (P.12): each dmg's app is checked for its
#             architecture and started from the image (x64 under Rosetta 2)
# The installers and the Lock zips of every run are artifacts, kept 14 days, for the lab session. The
# published release, with stable download links, comes from desktop-dist.yml (WP 0.15); it never holds
# the lab or smoke zip.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # No third-party telemetry from the toolchain (CLAUDE.md).
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  # Only the desktop packaging needs Electron's own download, and electron-builder fetches that itself.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  check:
    name: Lint, guards, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: i18n messages are built from the catalog
        run: |
          pnpm i18n:build
          git diff --exit-code -- packages/i18n/messages
      - name: Tokens are built from figma-variables.json
        run: pnpm --filter @uki/tokens build:check
      - name: pnpm check
        run: pnpm check

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Needed only if the repository moves to an organization account.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  stack:
    name: Database, functions, desktop flow, dashboard smoke test, demo scripts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright Chromium for the dashboard smoke test
        run: pnpm exec playwright install --with-deps chromium
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      # The containers Üki does not use stay out (scripts/lib/local-stack.ts, STACK_EXCLUDE); the edge
      # runtime runs under functions serve. The database tests run here; on a laptop only with pnpm dev:local.
      - name: Start the slim local stack (pnpm db:start, as pnpm dev:local starts it)
        run: pnpm db:start
      - name: Clean db reset with every migration and the seed (P.9)
        run: |
          pnpm db:reset
          applied="$(docker exec supabase_db_uki psql -U postgres -tAc 'select count(*) from supabase_migrations.schema_migrations')"
          files="$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l | tr -d ' ')"
          exams="$(docker exec supabase_db_uki psql -U postgres -tAc 'select count(*) from public.exams')"
          echo "db reset: $applied of $files migrations applied; seed: $exams exams"
          test "$applied" -eq "$files"
          test "$exams" -gt 0
      - name: Write .env from the local stack
        run: pnpm env:local
      - name: pgTAP (RLS for every role, RPCs, triggers)
        run: pnpm db:test
      - name: Staff accounts
        run: pnpm seed:staff
      - name: Serve the Edge Functions (as pnpm dev:local does)
        run: nohup pnpm functions:serve > functions-serve.log 2>&1 &
      - name: Functions and realtime integration tests
        run: pnpm test:integration
      - name: Desktop flow against the stack (join, ingest, frames, commands, submit)
        run: pnpm test:integration:desktop
      - name: Dashboard smoke test
        run: pnpm e2e
      - name: Demo scripts against the schema
        run: |
          pnpm demo:reset
          pnpm demo:simulate --sessions 20 --speed 4 --start-after 15 --seconds 50 --watch
          pnpm demo:reset
      - name: send-invites and pilot-notify with UKI_EMAIL_SINK (the functions served again with a sink)
        run: |
          pkill -f "functions serve" || true
          sleep 5
          cp supabase/functions/local.env "$RUNNER_TEMP/functions-sink.env"
          echo "UKI_EMAIL_SINK=sink@uki.test" >> "$RUNNER_TEMP/functions-sink.env"
          nohup supabase functions serve --env-file "$RUNNER_TEMP/functions-sink.env" > functions-serve-sink.log 2>&1 &
          UKI_FUNCTIONS_ENV_FILE="$RUNNER_TEMP/functions-sink.env" pnpm exec vitest run -c vitest.integration.config.ts --project integration test/integration/send-invites.test.ts test/integration/pilot-notify.test.ts
      - name: Logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stack-logs
          path: |
            functions-serve.log
            functions-serve-sink.log
            playwright-report/
            e2e/playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Web, mock portal and Üki Lock builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Public build values: repository variables when set, otherwise the local stack's address.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'http://127.0.0.1:54721' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci_placeholder' }}
      LOCK_DEV_PUBLIC_KEY: ${{ vars.LOCK_DEV_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Web dashboard
        run: pnpm --filter web build
      - name: Mock exam portal
        run: pnpm --filter lms-mock build
      - name: Üki Lock (Chrome and Edge)
        run: pnpm --filter lock zip
      # upload-artifact skips hidden folders, and WXT writes to apps/lock/.output, so the zips are copied
      # out under the release names first (scripts/release-assets.ts; WP 0.15).
      - name: Üki Lock zips under the release names
        run: pnpm release:assets stage --platform lock --out "$RUNNER_TEMP/uki-lock"
      - name: Upload Üki Lock
        uses: actions/upload-artifact@v4
        with:
          name: uki-lock
          path: ${{ runner.temp }}/uki-lock/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Playwright Chrome for Testing for the Üki Lock smoke test
        run: pnpm exec playwright install --with-deps chromium
      - name: Üki Lock smoke test (pairing, lock, blocked tab and site, copy, release; headless)
        run: |
          pnpm --filter lock build
          PW_CHROMIUM="$(node --input-type=module -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath())")"
          export PW_CHROMIUM
          SMOKE_SHOTS="$RUNNER_TEMP/lock-smoke" pnpm --filter lock smoke
      - name: Üki Lock smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lock-smoke
          path: ${{ runner.temp }}/lock-smoke
          if-no-files-found: ignore
          retention-days: 7

  windows:
    # WP 0.12 (docs/phase-0-plan.md): Windows breakage shows up here, without lab time. Every
    # Windows-only behaviour gets a test in this job and a line in docs/runbooks/lab-session.md.
    name: Windows (unit tests, zips, installer, launch test)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Unsigned in Phase 0 (Builds); electron-builder must not look for a certificate.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'http://127.0.0.1:54721' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci_placeholder' }}
      VITE_LOCK_EXTENSION_ID: ${{ vars.VITE_LOCK_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Text files are checked out with LF (.gitattributes)
        shell: bash
        run: |
          crlf="$(git ls-files --eol | awk '$2 == "w/crlf" || $2 == "w/mixed" { print $NF }')"
          if [ -n "$crlf" ]; then echo "::error::CRLF in the checkout:"; echo "$crlf"; exit 1; fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm check
        run: pnpm check
      - name: Keyboard hook (WP 0.13) installs and removes the real WH_KEYBOARD_LL hook through Koffi
        run: pnpm --filter desktop exec vitest run --reporter=verbose src/main/keyboard-hook.win32.test.ts
      - name: Model files cache
        uses: actions/cache@v4
        with:
          path: |
            apps/desktop/resources/models
            !apps/desktop/resources/models/manifest.json
          key: models-${{ hashFiles('apps/desktop/resources/models/manifest.json') }}
      - name: Models from the SHA-256 manifest
        run: |
          pnpm models
          pnpm models:verify
      - name: NSIS installer and zip (x64)
        run: pnpm --filter desktop run dist --publish never
      - name: The zip carries the keyboard hook's Koffi (WP 0.13)
        shell: pwsh
        run: |
          $zip = Get-ChildItem apps/desktop/release -Filter 'Uki-*-x64.zip' | Select-Object -First 1
          ./.github/scripts/windows-koffi-check.ps1 -Zip $zip.FullName
      - name: The shipped build carries no developer overlay, synthetic camera or smoke marker
        shell: bash
        run: bash .github/scripts/desktop-variant-check.sh production
      - name: Launch test from the zip, unpacked into a new folder
        shell: pwsh
        run: |
          $zip = Get-ChildItem apps/desktop/release -Filter 'Uki-*-x64.zip' | Select-Object -First 1
          ./.github/scripts/windows-launch-test.ps1 -Zip $zip.FullName -Screenshot "$env:RUNNER_TEMP/launch/zip.png"
      - name: Current-user install with the NSIS installer, then the launch test
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/release -Filter 'Uki-*-x64.exe' | Select-Object -First 1
          $run = Start-Process -FilePath $installer.FullName -ArgumentList '/S', '/currentuser' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "the installer exited with code $($run.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Uki\Uki.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter 'Uki.exe' -ErrorAction SilentlyContinue
            throw "no current-user install at $exe"
          }
          ./.github/scripts/windows-koffi-check.ps1 -Folder (Split-Path -Parent $exe)
          ./.github/scripts/windows-launch-test.ps1 -Exe $exe -Screenshot "$env:RUNNER_TEMP/launch/installed.png"
      - name: Lab zip (developer overlay and Ctrl+Shift+Q on; never shipped)
        run: pnpm --filter desktop run dist:lab --publish never
      - name: The lab zip carries the keyboard hook's Koffi (WP 0.13)
        shell: pwsh
        run: |
          $zip = Get-ChildItem apps/desktop/release/lab -Filter 'Uki-lab-*-x64.zip' | Select-Object -First 1
          ./.github/scripts/windows-koffi-check.ps1 -Zip $zip.FullName
      - name: The lab build carries the developer overlay and nothing else
        shell: bash
        run: |
          bash .github/scripts/desktop-variant-check.sh lab
          ls -l apps/desktop/release/*.zip apps/desktop/release/*.exe apps/desktop/release/lab/*.zip
      # Artifacts for the lab session (docs/runbooks/lab-session.md): both zips and the installer. They
      # are zips already, so the upload does not compress them again.
      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: uki-windows-x64-zip
          path: apps/desktop/release/Uki-*-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload the lab zip
        uses: actions/upload-artifact@v4
        with:
          name: uki-windows-x64-lab-zip
          path: apps/desktop/release/lab/Uki-lab-*-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: uki-windows-x64-installer
          path: apps/desktop/release/Uki-*-x64.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      # The smoke zip (docs/runbooks/lab-session.md, "Smoke box (VPS)"): a Windows box with no webcam,
      # reached over Remote Desktop. Detection reads the synthetic camera; the overlay, Ctrl+Shift+Q and the
      # SMOKE BUILD marker are on; content protection is off. It is built with the release's variables
      # (desktop-dist.yml), with no local fallback, so it talks to the cloud project. Never shipped.
      - name: Smoke zip (synthetic camera, overlay, Ctrl+Shift+Q, SMOKE BUILD marker; never shipped)
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_LOCK_EXTENSION_ID: ${{ vars.VITE_LOCK_EXTENSION_ID }}
        run: |
          case "$VITE_SUPABASE_URL" in https://*) ;; *) echo "::error::the smoke zip needs the VITE_SUPABASE_URL variable (the cloud project)"; exit 1;; esac
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*) ;; *) echo "::error::the smoke zip needs the VITE_SUPABASE_PUBLISHABLE_KEY variable (sb_publishable_...)"; exit 1;; esac
          pnpm --filter desktop run dist:smoke --publish never
      - name: The smoke build carries the overlay, the synthetic camera and the marker, and the cloud project
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_LOCK_EXTENSION_ID: ${{ vars.VITE_LOCK_EXTENSION_ID }}
        run: |
          bash .github/scripts/desktop-variant-check.sh smoke
          grep -rqF "$VITE_SUPABASE_URL" apps/desktop/out/renderer || { echo "::error::the smoke renderer has no $VITE_SUPABASE_URL"; exit 1; }
          if [ -n "$VITE_LOCK_EXTENSION_ID" ]; then
            grep -rqF "$VITE_LOCK_EXTENSION_ID" apps/desktop/out/main || { echo "::error::the smoke main process has no $VITE_LOCK_EXTENSION_ID"; exit 1; }
          fi
          ls -l apps/desktop/release/smoke/*.zip
      - name: Launch test from the smoke zip (title and log say smoke build)
        shell: pwsh
        run: |
          $zip = Get-ChildItem apps/desktop/release/smoke -Filter 'Uki-smoke-*-x64.zip' | Select-Object -First 1
          ./.github/scripts/windows-launch-test.ps1 -Zip $zip.FullName -Screenshot "$env:RUNNER_TEMP/launch/smoke.png" `
            -ExpectTitle 'SMOKE BUILD' -ExpectLog '[desktop] smoke build'
      - name: Upload the smoke zip
        uses: actions/upload-artifact@v4
        with:
          name: uki-windows-x64-smoke-zip
          path: apps/desktop/release/smoke/Uki-smoke-*-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Launch test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-launch-test
          path: ${{ runner.temp }}/launch
          if-no-files-found: ignore
          retention-days: 14

  desktop:
    name: Desktop installer (macOS dmg arm64 and x64)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Unsigned in Phase 0 (Builds); electron-builder must not look for a certificate.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'http://127.0.0.1:54721' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci_placeholder' }}
      VITE_LOCK_EXTENSION_ID: ${{ vars.VITE_LOCK_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Model files cache
        uses: actions/cache@v4
        with:
          path: |
            apps/desktop/resources/models
            !apps/desktop/resources/models/manifest.json
          key: models-${{ hashFiles('apps/desktop/resources/models/manifest.json') }}
      - name: Models from the SHA-256 manifest
        run: |
          pnpm models
          pnpm models:verify
      # Both architectures in one run (electron-builder.yml); the x64 Electron download happens here.
      - name: Build the dmg for arm64 and x64
        run: pnpm --filter desktop run dist --publish never
      - name: The shipped build carries no developer overlay, synthetic camera or smoke marker
        run: bash .github/scripts/desktop-variant-check.sh production
      - name: Rosetta 2 for the x64 launch
        run: arch -x86_64 /usr/bin/true 2> /dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - name: Each dmg holds its architecture's app, and the app starts from it (P.12)
        run: bash .github/scripts/macos-dmg-check.sh "$RUNNER_TEMP/launch"
      - name: Upload the arm64 dmg
        uses: actions/upload-artifact@v4
        with:
          name: uki-macos-arm64-dmg
          path: apps/desktop/release/Uki-*-arm64.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload the x64 dmg
        uses: actions/upload-artifact@v4
        with:
          name: uki-macos-x64-dmg
          path: apps/desktop/release/Uki-*-x64.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: macOS launch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-launch-test
          path: ${{ runner.temp }}/launch
          if-no-files-found: ignore
          retention-days: 14
