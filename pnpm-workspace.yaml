packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - electron
  - esbuild
  - lefthook
  - sharp
  - "@swc/core"
  - unrs-resolver
  - "@parcel/watcher"
  - protobufjs
  - spawn-sync

# Turbo runs many `pnpm run` at once; the deps check rewrites node_modules/.pnpm-workspace-state-v1.json
# and parallel readers then hit a half-written file. Install explicitly instead.
verifyDepsBeforeRun: false
