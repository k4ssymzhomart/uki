# Unsigned Phase 0 installers ("Builds" in docs/phase-0-plan.md): dmg for macOS arm64 and x64, NSIS and
# zip for Windows x64. Build the dmg on the MacBook itself and Windows on GitHub's Windows runners; runbook:
# docs/runbooks/lab-session.md.
# One arch on this machine: pnpm --filter desktop dist --mac dmg --arm64 (or --win nsis --x64 on Windows).
# Run `pnpm --filter @uki/detection models` and `models:verify` first: the model binaries are not in git.
appId: kz.uki.app
# The bundle, executable and helper names are ASCII. With "Üki" here the macOS helpers are written with a
# decomposed Ü while Electron looks them up with the precomposed CFBundleName, and the packaged app dies
# at launch ("Unable to find helper app"). People still see Üki: CFBundleDisplayName below, the Windows
# shortcut, and app.name, which comes from package.json's productName (and names the userData folder).
productName: Uki
artifactName: Uki-${version}-${arch}.${ext}
directories:
  output: release
  # The app icon comes from here: icon.icns (macOS) and icon.ico (Windows), the brand kit's exports of
  # Figma "App icon" 6:37.
  buildResources: build
# electron-vite bundles main, preload and renderer into out/, so the app needs no node_modules.
files:
  - out/**/*
  - package.json
  - "!**/node_modules/**/*"
asar: true
npmRebuild: false
# Models, wasm and language data, served as uki://app/resources/models/... (src/main/protocol.ts).
extraResources:
  - from: resources/models
    to: resources/models
    filter:
      - "**/*"
# The fuses (the five of "Hardening", and GrantFileProtocolExtraPrivileges off because nothing loads from
# file://) are flipped by this hook, not by electron-builder's own electronFuses option. In
# electron-builder 26.15 both run at the same point: after the asar integrity data is written
# (Windows resource, macOS Info.plist) and before signing and the Windows resource edit, and both give the
# same fuse wire on Electron 44 (compared on 2026-10-07 with `electron-fuses read`, dir builds only). The
# hook uses @electron/fuses 2.x from this package and renews the ad hoc signature on macOS only;
# electronFuses would use app-builder-lib's 1.8 and could not limit resetAdHocDarwinSignature to macOS.
afterPack: build/after-pack.cjs
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.education
  identity: null
  extendInfo:
    CFBundleDisplayName: Üki
    # Catalog key join.privacy (en). Without this key macOS refuses the camera.
    NSCameraUsageDescription: Your camera stays on this laptop. Only events and flagged frames are sent.
dmg:
  sign: false
# Windows x64 (WP 0.12): the NSIS installer, whose install-mode page offers an install for the current user
# only, and a zip of the unpacked app that runs from any folder or a USB drive without an install. CI also
# builds the lab variant of the zip from electron-builder.lab.yml (pnpm dist:lab); it never ships.
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  # The keyboard hook's Koffi (WP 0.13, src/main/keyboard-hook-win32.ts), outside the asar so Windows
  # loads its native file from disk: resources/koffi/node_modules/koffi, the loader with its MIT licence,
  # and resources/koffi/node_modules/@koromix/koffi-win32-x64, the binary (an optional dependency of this
  # package, installed on Windows only). macOS builds carry neither. build/after-pack.cjs fails the build
  # when either is missing, so the zip, the lab zip and the installer all have it.
  extraResources:
    - from: node_modules/koffi
      to: koffi/node_modules/koffi
      filter:
        - package.json
        - LICENSE.txt
        - index.cjs
        - src/koffi/index.cjs
        - src/koffi/src/static.cjs
    - from: node_modules/@koromix/koffi-win32-x64
      to: koffi/node_modules/@koromix/koffi-win32-x64
      filter:
        - package.json
        - index.js
        - win32_x64/koffi.node
nsis:
  oneClick: false
  perMachine: false
  shortcutName: Üki
  uninstallDisplayName: Üki ${version}
